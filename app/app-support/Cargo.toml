[package]
name = "halo2-app-support"
version = "0.1.0"
edition = "2021"

[dependencies]
halo2-bridge-core = { path = "../bridge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
mdns-sd = "0.21.4"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
