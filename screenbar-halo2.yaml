esphome:
  name: screenbar-halo2
  friendly_name: BenQ ScreenBar HALO 2
  includes:
    - bm5602_halo2.h
    - halo2_address_learning.h
    - halo2_pairing_storage.h
    - halo2_packet_diagnostics.h
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          const auto v=bm5602_halo2::setup_exact_pico(
            bm5602_halo2::RADIO_ADDRESS,bm5602_halo2::RADIO_CHANNEL);
          if(v[0]!=0x56||v[1]!=0x02||v[2]!=0x01){
            char error[80]; snprintf(error,sizeof(error),"BM5602 ERROR VERSION=%02X %02X %02X",v[0],v[1],v[2]);
            id(radio_status).publish_state(error);
            id(app_bridge).configure(halo2_protocol::Radio::Fault,halo2_protocol::Pairing::Unpaired,false,false,"RADIO_VERSION");
            return;
          }
          const auto source=bm5602_halo2::restore_or_initialize_pairing();
          const char *pair_status=source==bm5602_halo2::PairingBootSource::Restored?"RESTORED":
            source==bm5602_halo2::PairingBootSource::Initialized?"INITIALIZED":"RAM ONLY";
          const auto &address=bm5602_halo2::active_radio_address;
          ESP_LOGI("halo2", "HALO2 PAIRING %s ADDRESS=%02X %02X %02X %02X CRC_SEED=%04X PCF_PREFIX_ZERO=%u",
            pair_status,address[0],address[1],address[2],address[3],
            bm5602_halo2::active_crc_seed,bm5602_halo2::tx_pcf_prefix_zero?1U:0U);
          bm5602_halo2::prepare_halo_receive();
          id(app_bridge).set_reporter([](const char *message){id(radio_status).publish_state(message);});
          id(app_bridge).set_sender([](uint8_t command,const halo2_protocol::LightState &state){
            if(bm5602_halo2::address_learning||!bm5602_halo2::crc_seed_ready)
              return halo2_protocol::TxResult{false,false,0,0,0,"RADIO_UNAVAILABLE",false};
            const bool ok=bm5602_halo2::send_halo_state(command,state.power,state.ultrasonic,
              state.mode!=halo2_protocol::Mode::Back,state.mode!=halo2_protocol::Mode::Front,
              state.front,state.back,state.temperature);
            if(!bm5602_halo2::halo_last_tx_packet_engine)
              return halo2_protocol::TxResult{true,ok,0,0,0,"TX_TIMEOUT",false};
            const auto &tx=bm5602_halo2::halo_last_packet_result;
            return halo2_protocol::TxResult{tx.attempted,ok,tx.irq,tx.fifo_status,tx.mode,
              !tx.attempted?"TX_FIFO_STUCK":(tx.irq&0x10U)?"TX_MAX_RETRIES":"TX_TIMEOUT"};
          });
          id(app_bridge).set_publisher([](const halo2_protocol::LightState &state){
            id(halo_power)=state.power; id(halo_pir)=state.ultrasonic;
            id(halo_front)=state.mode!=halo2_protocol::Mode::Back; id(halo_back)=state.mode!=halo2_protocol::Mode::Front;
            id(halo_front_brightness)=state.front; id(halo_back_brightness)=state.back; id(halo_temperature)=state.temperature;
            id(screenbar_power).publish_state(state.power); id(pir_switch).publish_state(state.ultrasonic);
            id(front_lamp_switch).publish_state(id(halo_front)); id(back_lamp_switch).publish_state(id(halo_back));
            id(front_brightness).publish_state(state.front); id(back_brightness).publish_state(state.back);
            id(color_temperature).publish_state(state.temperature);
            id(lamp_mode).publish_state(state.mode==halo2_protocol::Mode::Both?"Both":state.mode==halo2_protocol::Mode::Back?"Back":"Front");
          });
          halo2_protocol::LightState initial;
          initial.power=id(halo_power); initial.ultrasonic=id(halo_pir);
          initial.mode=id(halo_front)&&id(halo_back)?halo2_protocol::Mode::Both:id(halo_back)?halo2_protocol::Mode::Back:halo2_protocol::Mode::Front;
          initial.front=id(halo_front_brightness); initial.back=id(halo_back_brightness); initial.temperature=id(halo_temperature);
          halo2_protocol::Patch check; check.fields=halo2_protocol::ALL; check.values=initial;
          id(app_bridge).restore(check.valid()?initial:halo2_protocol::LightState{});
          id(sync_api_radio).execute();
          char text[96]; snprintf(text,sizeof(text),"READY VERSION=%02X %02X %02X TBCLK=G25 RX=ON PAIR=%s",
            v[0],v[1],v[2],pair_status); id(radio_status).publish_state(text);

external_components:
  - source:
      type: local
      path: components
    components: [halo2_api]
halo2_api:
  id: app_bridge
  port: &halo2_app_port 8080
  username: !secret web_username
  password: !secret web_password

mdns:
  services:
    - service: "_halo2-bridge"
      protocol: "_tcp"
      port: *halo2_app_port
      txt:
        api: "1"
        model: "screenbar-halo2-bridge"

esp32:
  board: m5stack-atom
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "24"
logger:
wifi:
  # Mains-powered bridge: avoid modem-sleep latency for local API commands.
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "Halo2 recovery"
    password: !secret fallback_password
captive_portal:
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
web_server:
  port: 80
  ota: false
  auth:
    type: basic
    username: !secret web_username
    password: !secret web_password

globals:
  - { id: halo_power, type: bool, restore_value: yes, initial_value: "false" }
  - { id: halo_pir, type: bool, restore_value: yes, initial_value: "false" }
  - { id: halo_front, type: bool, restore_value: yes, initial_value: "true" }
  - { id: halo_back, type: bool, restore_value: yes, initial_value: "true" }
  - { id: halo_front_brightness, type: uint8_t, restore_value: yes, initial_value: "12" }
  - { id: halo_back_brightness, type: uint8_t, restore_value: yes, initial_value: "91" }
  - { id: halo_temperature, type: uint16_t, restore_value: yes, initial_value: "3925" }

text_sensor:
  - platform: template
    id: rf_last_packet
    name: "RF last packet"
    entity_category: diagnostic
    update_interval: 1s
    lambda: return bm5602_halo2::packet_diagnostics.last.json();
  - platform: template
    id: rf_last_failure
    name: "RF last failure"
    entity_category: diagnostic
    update_interval: 1s
    lambda: return bm5602_halo2::packet_diagnostics.failure.json();
  - platform: template
    id: radio_status
    name: "Radio status"
  - platform: template
    id: lamp_state
    name: "Lamp state"

switch:
  - platform: template
    id: screenbar_power
    name: "Power"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - lambda: id(app_bridge).set_power(true);
    turn_off_action:
      - lambda: id(app_bridge).set_power(false);
  - platform: template
    id: front_lamp_switch
    name: "Front lamp"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - lambda: id(app_bridge).set_lamp(true, true);
    turn_off_action:
      - lambda: id(app_bridge).set_lamp(true, false);
  - platform: template
    id: back_lamp_switch
    name: "Back lamp"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - lambda: id(app_bridge).set_lamp(false, true);
    turn_off_action:
      - lambda: id(app_bridge).set_lamp(false, false);
  - platform: template
    id: pir_switch
    name: "Ultrasonic sensor"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - lambda: id(app_bridge).set_ultrasonic(true);
    turn_off_action:
      - lambda: id(app_bridge).set_ultrasonic(false);

number:
  - platform: template
    id: front_brightness
    name: "Front brightness"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: false
    restore_value: false
    initial_value: 12
    set_action:
      - lambda: id(app_bridge).set_number(halo2_protocol::FRONT, x);
  - platform: template
    id: back_brightness
    name: "Back brightness"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: false
    restore_value: false
    initial_value: 91
    set_action:
      - lambda: id(app_bridge).set_number(halo2_protocol::BACK, x);
  - platform: template
    id: color_temperature
    name: "Color temperature"
    min_value: 2700
    max_value: 6500
    step: 25
    optimistic: false
    restore_value: false
    initial_value: 3925
    set_action:
      - lambda: id(app_bridge).set_number(halo2_protocol::TEMPERATURE, x);

select:
  - platform: template
    id: lamp_mode
    name: "Lamp mode"
    options: ["Front", "Back", "Both"]
    optimistic: false
    restore_value: false
    initial_option: "Both"
    set_action:
      - lambda: |-
          id(app_bridge).set_mode(x=="Front" ? halo2_protocol::Mode::Front : x=="Back" ? halo2_protocol::Mode::Back : halo2_protocol::Mode::Both);

script:
  - id: sync_api_radio
    mode: single
    then:
      - lambda: |-
          const bool learning=bm5602_halo2::address_learning;
          const bool ready=bm5602_halo2::crc_seed_ready;
          const bool framed=bm5602_halo2::tx_pcf_prefix_zero;
          const bool verified=bm5602_halo2::active_radio_address==bm5602_halo2::VERIFIED_PAIRING.address &&
            bm5602_halo2::active_crc_seed==bm5602_halo2::VERIFIED_PAIRING.crc_seed && framed;
          id(app_bridge).configure(learning?halo2_protocol::Radio::Learning:
            ready?halo2_protocol::Radio::Ready:halo2_protocol::Radio::Initializing,
            learning?halo2_protocol::Pairing::Learning:ready?halo2_protocol::Pairing::Ready:halo2_protocol::Pairing::Unpaired,
            bm5602_halo2::pairing_is_persisted,verified);
  - id: probe_replay_off
    mode: queued
    parameters:
      phase: int
      invert_data: bool
      fresh_pcf: bool
      channel: int
    then:
      - lambda: |-
          esphome::halo2_api::Maintenance lease(id(app_bridge));
          if(!lease)return;
          if(!bm5602_halo2::captured_remote_off_valid){
            id(radio_status).publish_state("NO CAPTURED REMOTE OFF"); return;
          }
          const auto &frame=bm5602_halo2::captured_remote_off;
          const bool ok=bm5602_halo2::replay_captured_remote_off(
            phase,invert_data,fresh_pcf,static_cast<uint8_t>(channel));
          ESP_LOGI("halo2", "HALO2 REPLAY REMOTE OFF channel=%d phase=%d invert=%u fresh=%u captured_pcf=%02X PCF=%02X CMD=%02X CONTROL=%02X CRC=%04X %s",
            channel,phase,static_cast<unsigned>(invert_data),static_cast<unsigned>(fresh_pcf),
            frame[0],bm5602_halo2::halo_last_pcf,frame[1],frame[2],bm5602_halo2::halo_last_crc,ok?"sent":"NO CLOCK");
          char status[96]; snprintf(status,sizeof(status),"REPLAY OFF CH%d P%d I%d F%d PCF=%02X CRC=%04X %s",
            channel,phase,invert_data,fresh_pcf,bm5602_halo2::halo_last_pcf,
            bm5602_halo2::halo_last_crc,ok?"sent":"NO CLOCK");
          id(radio_status).publish_state(status);
  - id: probe_power_sync
    mode: single
    then:
      - lambda: |-
          esphome::halo2_api::Maintenance lease(id(app_bridge));
          if(!lease)return;
          if(!bm5602_halo2::crc_seed_ready){id(radio_status).publish_state("WAIT FOR CRC SEED");return;}
          bool ok=true;
          for(uint8_t cmd : {0x02,0x04}){
            ok=bm5602_halo2::send_halo_state(cmd,id(halo_power),id(halo_pir),id(halo_front),id(halo_back),
              id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature)) && ok;
          }
          id(radio_status).publish_state(ok?"TX PROBE SENT":"TX PROBE FAILED");

button:
  - platform: template
    name: "Replay captured remote OFF"
    on_press:
      - script.execute:
          id: probe_replay_off
          phase: 0
          invert_data: false
          fresh_pcf: false
          channel: 5
  - platform: template
    name: "Replay OFF new PCF"
    on_press:
      - script.execute:
          id: probe_replay_off
          phase: 0
          invert_data: false
          fresh_pcf: true
          channel: 5
  - platform: template
    name: "Replay OFF opposite edge"
    on_press:
      - script.execute:
          id: probe_replay_off
          phase: 1
          invert_data: false
          fresh_pcf: true
          channel: 5
  - platform: template
    name: "Replay OFF inverted data"
    on_press:
      - script.execute:
          id: probe_replay_off
          phase: 0
          invert_data: true
          fresh_pcf: true
          channel: 5
  - platform: template
    name: "Replay OFF opposite edge inverted"
    on_press:
      - script.execute:
          id: probe_replay_off
          phase: 1
          invert_data: true
          fresh_pcf: true
          channel: 5
  - platform: template
    name: "Replay OFF channel 46"
    on_press:
      - script.execute:
          id: probe_replay_off
          phase: 0
          invert_data: false
          fresh_pcf: true
          channel: 46
  - platform: template
    name: "Replay OFF channel 75"
    on_press:
      - script.execute:
          id: probe_replay_off
          phase: 0
          invert_data: false
          fresh_pcf: true
          channel: 75
  - platform: template
    name: "Test packet engine OFF"
    on_press:
      - lambda: |-
          esphome::halo2_api::Maintenance lease(id(app_bridge));
          if(!lease)return;
          const auto result=bm5602_halo2::send_captured_off_packet_engine();
          if(!result.attempted){
            id(radio_status).publish_state("PACKET ENGINE NEEDS CAPTURED OFF / PCF9"); return;
          }
          ESP_LOGI("halo2", "HALO2 PACKET ENGINE OFF IRQ=%02X STATUS=%02X MODE=%u TX_DS=%u MAX_RT=%u",
            result.irq,result.fifo_status,result.mode,
            (result.irq&0x20U)?1U:0U,(result.irq&0x10U)?1U:0U);
          char status[80]; snprintf(status,sizeof(status),"PACKET OFF IRQ=%02X FIFO=%02X TX_DS=%u MAX_RT=%u",
            result.irq,result.fifo_status,(result.irq&0x20U)?1U:0U,
            (result.irq&0x10U)?1U:0U);
          id(radio_status).publish_state(status);
  - platform: template
    name: "Test power sync (02 + 04)"
    on_press:
      - script.execute: probe_power_sync
  - platform: template
    name: "Start address learning"
    on_press:
      - lambda: |-
          esphome::halo2_api::Maintenance lease(id(app_bridge));
          if(!lease)return;
          bm5602_halo2::start_address_learning();
          id(app_bridge).configure(halo2_protocol::Radio::Learning,halo2_protocol::Pairing::Learning,
            bm5602_halo2::pairing_is_persisted,false,nullptr,true);
          esp_rom_delay_us(10000);
          const uint8_t channel=bm5602_halo2::read_reg(0x10);
          const uint8_t dm1=bm5602_halo2::read_reg(0x11);
          const uint8_t width=bm5602_halo2::read_reg(0x2C);
          const uint8_t mode=bm5602_halo2::read_reg(0x26)&0x07U;
          std::array<uint8_t,3> sync{};
          bm5602_halo2::read_bytes(0x90,sync.data(),sync.size());
          ESP_LOGI("halo2", "HALO2 ADDRESS RX CONFIG: RFCH=%u DM1=%02X RXPW0=%u STA1_MODE=%u SYNC=%02X %02X %02X (RX=5)",
            channel,dm1,width,mode,sync[0],sync[1],sync[2]);
          ESP_LOGI("halo2", "HALO2 ADDRESS LEARNING: set rear brightness to 10 and color temperature to 3925 K; operate the original remote");
          id(radio_status).publish_state(channel==5 && dm1==0x42 && width==16 && mode==5 &&
            sync==bm5602_halo2::LEARNING_SYNC
            ? "ADDRESS LEARNING RX=ON" : "ADDRESS LEARNING RX CONFIG ERROR");
  - platform: template
    name: "Cancel address learning"
    on_press:
      - lambda: |-
          esphome::halo2_api::Maintenance lease(id(app_bridge));
          if(!lease)return;
          bm5602_halo2::stop_address_learning();
          id(sync_api_radio).execute();
          id(radio_status).publish_state("READY ADDRESS LEARNING CANCELLED");
  - platform: template
    name: "Apply found address (RAM)"
    on_press:
      - lambda: |-
          esphome::halo2_api::Maintenance lease(id(app_bridge));
          if(!lease)return;
          if(!bm5602_halo2::apply_found_address()){
            id(radio_status).publish_state("NO VERIFIED ADDRESS"); return;
          }
          id(sync_api_radio).execute();
          const auto &a=bm5602_halo2::active_radio_address;
          esp_rom_delay_us(10000);
          const uint8_t channel=bm5602_halo2::read_reg(0x10);
          const uint8_t dm1=bm5602_halo2::read_reg(0x11);
          const uint8_t width=bm5602_halo2::read_reg(0x2C);
          const uint8_t mode=bm5602_halo2::read_reg(0x26)&0x07U;
          std::array<uint8_t,4> rx_address{};
          bm5602_halo2::read_bytes(0x90,rx_address.data(),rx_address.size());
          ESP_LOGI("halo2", "HALO2 NORMAL RX CONFIG: RFCH=%u DM1=%02X RXPW0=%u STA1_MODE=%u ADDRESS=%02X %02X %02X %02X",
            channel,dm1,width,mode,rx_address[0],rx_address[1],rx_address[2],rx_address[3]);
          if(channel!=5 || dm1!=0x82 || width!=14 || mode!=5 || rx_address!=a){
            id(radio_status).publish_state("ADDRESS APPLIED RX CONFIG ERROR");
            return;
          }
          char status[80]; snprintf(status,sizeof(status),"ADDRESS APPLIED %02X %02X %02X %02X (RAM)",a[0],a[1],a[2],a[3]);
          ESP_LOGI("halo2", "HALO2 ADDRESS APPLIED (register order, RAM): %02X %02X %02X %02X",a[0],a[1],a[2],a[3]);
          if(bm5602_halo2::crc_seed_ready && !bm5602_halo2::save_active_pairing())
            ESP_LOGW("halo2", "HALO2 PAIRING SAVE FAILED");
          id(radio_status).publish_state(bm5602_halo2::crc_seed_ready?status:"ADDRESS APPLIED; LEARNING CRC SEED");
  - platform: template
    name: "Resend current state"
    on_press:
      - lambda: id(app_bridge).resend();
  - platform: restart
    name: "Restart"

interval:
  - interval: 50ms
    then:
      - lambda: |-
          if(!id(app_bridge).initialized())return;
          id(sync_api_radio).execute();
          if(bm5602_halo2::address_learning){
            static uint32_t last_learning_log=0;
            static uint32_t logged_session=0;
            if(logged_session!=bm5602_halo2::learning_session){
              logged_session=bm5602_halo2::learning_session;
              last_learning_log=millis();
            }
            const auto result=bm5602_halo2::poll_address_learning();
            static uint32_t last_sample=0;
            static uint32_t sample_session=0;
            if(sample_session!=bm5602_halo2::learning_session){
              sample_session=bm5602_halo2::learning_session;
              last_sample=0;
            }
            if(bm5602_halo2::learning_captures>0 && bm5602_halo2::learning_captures<=5){
              if(last_sample!=bm5602_halo2::learning_captures){
                last_sample=bm5602_halo2::learning_captures;
                char sample[97]{}; size_t used=0;
                const size_t n=bm5602_halo2::learning_last_length<32
                  ?bm5602_halo2::learning_last_length:32;
                for(size_t i=0;i<n;++i){
                  used+=snprintf(sample+used,sizeof(sample)-used,"%02X%s",
                    bm5602_halo2::learning_last_raw[i],i+1<n?" ":"");
                }
                ESP_LOGI("halo2", "HALO2 ADDRESS SAMPLE len=%u raw=%s",
                  bm5602_halo2::learning_last_length,sample);
              }
            }
            if(result.accepted){
              const auto &a=result.address;
              ESP_LOGI("halo2", "HALO2 ADDRESS CANDIDATE: %02X %02X %02X %02X (%u/5) [register order]",
                a[0],a[1],a[2],a[3],result.votes);
              if(result.found){
                char status[80]; snprintf(status,sizeof(status),"ADDRESS FOUND %02X %02X %02X %02X",a[0],a[1],a[2],a[3]);
                ESP_LOGI("halo2", "HALO2 ADDRESS FOUND: %02X %02X %02X %02X [register order]",a[0],a[1],a[2],a[3]);
                id(radio_status).publish_state(status);
              }
            }
            const uint32_t learning_now=millis();
            if(learning_now-last_learning_log>=10000U){
              last_learning_log=learning_now;
              ESP_LOGI("halo2", "HALO2 ADDRESS LEARNING RX captures=%u rejected=%u",
                static_cast<unsigned>(bm5602_halo2::learning_captures),
                static_cast<unsigned>(bm5602_halo2::learning_rejected));
            }
            return;
          }
          static uint32_t last_publish=0;
          bm5602_halo2::HaloRxState s;
          const bool received=bm5602_halo2::poll_halo_receive(s)&&s.valid;
          if(bm5602_halo2::normal_rx_last_seed_votes){
            ESP_LOGI("halo2", "HALO2 CRC SEED CANDIDATE: %04X (%u/5)",
              bm5602_halo2::normal_rx_last_seed,bm5602_halo2::normal_rx_last_seed_votes);
          }
          if(bm5602_halo2::normal_rx_seed_found_event){
            char status[48]; snprintf(status,sizeof(status),"CRC SEED FOUND %04X",
              bm5602_halo2::active_crc_seed);
            ESP_LOGI("halo2", "HALO2 CRC SEED FOUND: %04X",bm5602_halo2::active_crc_seed);
            ESP_LOGI("halo2", "HALO2 TX FRAMING: PCF_PREFIX_ZERO=%u",
              bm5602_halo2::tx_pcf_prefix_zero?1U:0U);
            const bool saved=bm5602_halo2::save_active_pairing();
            id(sync_api_radio).execute();
            ESP_LOGI("halo2", "HALO2 PAIRING %s",saved?"SAVED TO FLASH":"SAVE FAILED");
            id(radio_status).publish_state(saved?status:"CRC SEED FOUND; PAIR UNSAVED");
          }
          if(bm5602_halo2::captured_remote_off_event){
            const auto &frame=bm5602_halo2::captured_remote_off;
            ESP_LOGI("halo2", "HALO2 REMOTE OFF CAPTURED PCF=%02X CMD=%02X CONTROL=%02X CRC=%02X%02X",
              frame[0],frame[1],frame[2],frame[11],frame[12]);
            id(radio_status).publish_state("REMOTE OFF CAPTURED");
          }
          if(bm5602_halo2::normal_rx_session){
            static uint32_t logged_rx_session=0;
            static uint32_t last_rx_sample=0;
            static uint32_t last_rx_log=0;
            if(logged_rx_session!=bm5602_halo2::normal_rx_session){
              logged_rx_session=bm5602_halo2::normal_rx_session;
              last_rx_sample=0;
              last_rx_log=millis();
            }
            const uint32_t captures=bm5602_halo2::normal_rx_captures;
