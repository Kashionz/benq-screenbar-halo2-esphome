name: Apple build validation
on:
  push:
    paths: ['app/**', 'protocol/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['app/**', 'protocol/**', '.github/workflows/apple.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      # Tauri generates Xcode project format 77; macos-14 defaults to Xcode 15.4.
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: npm ci
      - run: npm test
      - run: cargo test --locked -p halo2-bridge-core -p halo2-app-support
      - run: npm run tauri build -- --debug --bundles app
      # Checks the Rust iOS integration; this does not build/sign an Xcode app.
      - run: cargo check --locked -p halodesk --lib --target aarch64-apple-ios-sim
      - run: cargo check --locked -p halodesk --lib --target aarch64-apple-ios
      - run: npm run tauri ios init -- --ci
      - run: npm run tauri icon -- app-icon.svg --ios-color '#e9ebef'
      - run: npm run tauri ios build -- --debug --target aarch64-sim --ci --no-sign
      - name: Verify generated iOS permissions
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          plists = list(Path('src-tauri/gen/apple').glob('*/Info.plist'))
          assert plists, 'No generated iOS Info.plist'
          for path in plists:
              data = plistlib.loads(path.read_bytes())
              assert data.get('NSLocalNetworkUsageDescription')
              assert data.get('NSBonjourServices') == ['_halo2-bridge._tcp']
              assert data.get('UIFileSharingEnabled') is True
              assert data.get('LSSupportsOpeningDocumentsInPlace') is True
          print('Generated iOS LAN and document-sharing declarations verified')
          PY
      - name: Archive local-test application
        run: ditto -c -k --keepParent "target/debug/bundle/macos/HaloDesk.app" halo2-macos-arm64-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: halo2-macos-arm64-debug
          path: app/halo2-macos-arm64-debug.zip
          retention-days: 7
