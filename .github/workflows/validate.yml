name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  protocol-and-esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome==2026.9.0
      - name: Protocol vectors
        run: python -m unittest discover -s tests -v
      - name: Build address learning C++ test
        run: g++ -std=c++17 -Wall -Wextra -pedantic tests/test_address_learning.cpp -o /tmp/test_address_learning
      - name: Run address learning C++ test
        run: /tmp/test_address_learning
      - name: Create compile-only secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "compile-only"
          wifi_password: "compile-only-password"
          fallback_password: "compile-only-password"
          ota_password: "compile-only-password"
          api_encryption_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
          web_username: "screenbar"
          web_password: "compile-only-password"
          EOF
      - name: Validate ESPHome configuration
        run: esphome config screenbar-halo2.yaml
      - name: Compile firmware
        run: esphome compile screenbar-halo2.yaml
