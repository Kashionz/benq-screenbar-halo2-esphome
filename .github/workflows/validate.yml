name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  protocol-and-esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome==2026.9.0 -r protocol/v1/requirements-dev.txt
      - name: App protocol contract
        run: python tools/validate_app_protocol.py
      - name: Protocol vectors
        run: python -m unittest discover -s tests -v
      - name: Build address learning C++ test
        run: g++ -std=c++17 -Wall -Wextra -pedantic tests/test_address_learning.cpp -o /tmp/test_address_learning
      - name: Run address learning C++ test
        run: /tmp/test_address_learning
      - name: Command dispatcher scenarios
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic tests/test_dispatcher.cpp -o /tmp/test_dispatcher
          /tmp/test_dispatcher
      - name: Packet diagnostic retention
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic tests/test_packet_diagnostics.cpp -o /tmp/test_packet_diagnostics
          /tmp/test_packet_diagnostics
      - name: Create compile-only secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "compile-only"
          wifi_password: "compile-only-password"
          fallback_password: "compile-only-password"
          ota_password: "compile-only-password"
          api_encryption_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
          web_username: "screenbar"
          web_password: "compile-only-password"
          EOF
      - name: Validate ESPHome configuration
        run: esphome config screenbar-halo2.yaml
      - name: Compile firmware
        run: esphome compile screenbar-halo2.yaml
      - name: JSON codec and firmware response schemas
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -I.esphome/build/screenbar-halo2/managed_components/bblanchon__arduinojson/src tests/test_app_codec.cpp -o /tmp/test_app_codec
          /tmp/test_app_codec
          /tmp/test_app_codec --fixtures > /tmp/protocol_codec_fixtures.json
          python tools/validate_app_protocol.py --cpp-fixtures /tmp/protocol_codec_fixtures.json
